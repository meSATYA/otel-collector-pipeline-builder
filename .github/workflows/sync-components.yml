name: Sync OpenTelemetry Contrib components

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: component-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh component catalog and documentation
        run: npm run sync:components
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the refreshed app
        run: npm run build

      - name: Commit refreshed component data
        run: |
          if git diff --quiet -- app/page.tsx app/component-docs.ts; then
            echo "Component catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/component-docs.ts
          git commit -m "chore: sync OpenTelemetry Contrib components"
          git push origin HEAD:main
